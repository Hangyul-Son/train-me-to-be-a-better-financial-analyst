name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/build-tech-finance-site-HRNbI
      - claude/chinese-learning-app-ZzlfS
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  setup-pages:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Add branch to deployment policy
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            try {
              const { data: policies } = await github.rest.repos.listDeploymentBranchPolicies({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment_name: 'github-pages'
              });
              const exists = policies.branch_policies.some(p => p.name === branch);
              if (!exists) {
                await github.rest.repos.createDeploymentBranchPolicy({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  environment_name: 'github-pages',
                  name: branch,
                  type: 'branch'
                });
                console.log(`Added branch '${branch}' to deployment policy`);
              } else {
                console.log(`Branch '${branch}' already in deployment policy`);
              }
            } catch (e) {
              console.log('Could not modify deployment policy:', e.message);
            }

  deploy:
    needs: setup-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
