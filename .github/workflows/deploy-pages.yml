name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/build-tech-finance-site-HRNbI
      - claude/chinese-learning-app-ZzlfS
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages source to gh-pages branch
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.updateInformationAboutPagesSite({
                owner: context.repo.owner,
                repo: context.repo.repo,
                source: { branch: 'gh-pages', path: '/' }
              });
              console.log('Pages source updated to gh-pages branch');
            } catch (e) {
              console.log('Pages config update:', e.message);
            }

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .
          clean: true
