name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/build-tech-finance-site-HRNbI
      - claude/chinese-learning-app-ZzlfS
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages source to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Updating GitHub Pages source to gh-pages branch..."
          HTTP_CODE=$(curl -s -o /tmp/pages-response.json -w "%{http_code}" \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          echo "HTTP response code: $HTTP_CODE"
          cat /tmp/pages-response.json
          if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
            echo "Pages source successfully updated to gh-pages branch"
          else
            echo "Note: Could not update Pages source (code: $HTTP_CODE), continuing with deployment..."
          fi

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .
          clean: true
