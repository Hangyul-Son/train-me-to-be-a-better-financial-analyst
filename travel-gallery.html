<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Travel Memories</title>
  <link rel="stylesheet" href="css/gallery.css">
</head>
<body>

  <!-- Hero Section -->
  <header class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>영월 가족 여행</h1>
      <p class="hero-subtitle">강과 산이 어우러진 겨울 여행의 기록</p>
      <div class="scroll-indicator">
        <span></span>
      </div>
    </div>
  </header>

  <!-- Navigation -->
  <nav class="gallery-nav">
    <a href="index.html" class="back-link">&larr; Back to Hub</a>
    <span class="nav-title">Travel Gallery</span>
  </nav>

  <!-- Gallery Section -->
  <main class="gallery-container">
    <section class="gallery-intro">
      <h2>영월의 아름다운 순간들</h2>
      <p>한반도 지형 전망대, 맛있는 음식, 그리고 가족과 함께한 소중한 시간</p>
    </section>

    <div class="gallery-grid">
      <!-- Photo 1: 전망대 가족사진 -->
      <div class="gallery-item size-large" data-aos="fade-up">
        <div class="photo-wrapper">
          <img src="photos/photo1.jpg" alt="전망대에서 찍은 가족 단체사진, 푸른 강과 산이 보이는 배경" loading="lazy">
          <div class="photo-overlay">
            <span class="photo-caption">전망대에서 함께</span>
          </div>
        </div>
      </div>

      <!-- Photo 2: 맛집에서 식사 -->
      <div class="gallery-item size-medium" data-aos="fade-up">
        <div class="photo-wrapper">
          <img src="photos/photo2.jpg" alt="한식 맛집에서 돌솥밥과 생선구이를 먹는 모습" loading="lazy">
          <div class="photo-overlay">
            <span class="photo-caption">여행의 맛 - 돌솥밥 & 생선구이</span>
          </div>
        </div>
      </div>

      <!-- Photo 3: 절벽 전망대 셀카 -->
      <div class="gallery-item size-medium" data-aos="fade-up">
        <div class="photo-wrapper">
          <img src="photos/photo3.jpg" alt="절벽 위 전망대에서 찍은 가족 셀카, 강과 절벽이 보이는 풍경" loading="lazy">
          <div class="photo-overlay">
            <span class="photo-caption">절벽 위에서 찍은 셀카</span>
          </div>
        </div>
      </div>

      <!-- Photo 4: 한우 고깃집 -->
      <div class="gallery-item size-medium" data-aos="fade-up">
        <div class="photo-wrapper">
          <img src="photos/photo4.jpg" alt="한우 고깃집에서 신선한 한우를 준비하는 모습" loading="lazy">
          <div class="photo-overlay">
            <span class="photo-caption">한우의 향연</span>
          </div>
        </div>
      </div>

      <!-- Photo 5: 한반도 지형 전망대 -->
      <div class="gallery-item size-large" data-aos="fade-up">
        <div class="photo-wrapper">
          <img src="photos/photo5.jpg" alt="한반도 지형 전망대에서 찍은 가족 셀카, 강이 한반도 모양으로 굽이치는 풍경" loading="lazy">
          <div class="photo-overlay">
            <span class="photo-caption">한반도 지형 전망대에서</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close">&times;</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev">&#10094;</button>
    <button class="lightbox-nav lightbox-next" id="lightbox-next">&#10095;</button>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="">
      <p class="lightbox-caption" id="lightbox-caption"></p>
      <div class="lightbox-counter" id="lightbox-counter"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="gallery-footer">
    <p>Made with love &hearts; Our Travel Memories</p>
  </footer>

  <script src="js/gallery.js"></script>
</body>
</html>
